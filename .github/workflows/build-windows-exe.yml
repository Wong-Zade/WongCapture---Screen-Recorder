name: Build & Publish Windows x64 .EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

# A newer push cancels a build that is still running for the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, so every build uses the same versions
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Build Windows .EXE with Electron Builder
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WongCapture-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
